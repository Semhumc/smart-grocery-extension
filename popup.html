<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Grocery Extension</title>
    <style>
        body {
            width: 350px;
            padding: 0;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
        }
        
        .container {
            background: white;
            margin: 0;
        }
        
        .header {
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .header h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
        }
        
        .header p {
            margin: 8px 0 0 0;
            font-size: 12px;
            opacity: 0.9;
        }
        
        .content {
            padding: 20px;
        }
        
        .status {
            display: flex;
            align-items: center;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
        }
        
        .status.active {
            background: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
        }
        
        .status.inactive {
            background: #fef3c7;
            color: #92400e;
            border: 1px solid #fde68a;
        }
        
        .status-icon {
            margin-right: 8px;
            font-size: 16px;
        }
        
        .pending-ingredients {
            margin-bottom: 16px;
        }
        
        .pending-title {
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }
        
        .ingredient-list {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            padding: 8px;
            max-height: 120px;
            overflow-y: auto;
        }
        
        .ingredient-item {
            padding: 4px 0;
            font-size: 13px;
            color: #6b7280;
            border-bottom: 1px solid #f3f4f6;
        }
        
        .ingredient-item:last-child {
            border-bottom: none;
        }
        
        .no-ingredients {
            text-align: center;
            color: #9ca3af;
            font-size: 13px;
            padding: 20px;
        }
        
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .btn {
            padding: 12px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .btn:hover {
            transform: translateY(-1px);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn.primary {
            background: #ff6b35;
            color: white;
        }
        
        .btn.primary:hover {
            background: #e55a2b;
        }
        
        .btn.secondary {
            background: #f3f4f6;
            color: #374151;
        }
        
        .btn.secondary:hover {
            background: #e5e7eb;
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .loading {
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .loading.show {
            display: flex;
        }
        
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid #f3f4f6;
            border-top: 2px solid #ff6b35;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .footer {
            padding: 12px 20px;
            background: #f9fafb;
            border-top: 1px solid #e5e7eb;
            font-size: 11px;
            color: #6b7280;
            text-align: center;
        }
        
        .result-message {
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
        
        .result-message.success {
            background: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
        }
        
        .result-message.error {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }
        
        .result-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛍️ Smart Grocery</h1>
            <p>YemekSepeti Otomatik Sepete Ekleme</p>
        </div>
        
        <div class="content">
            <div id="status" class="status inactive">
                <span class="status-icon">⚠️</span>
                <span>YemekSepeti Market sayfasında değilsiniz</span>
            </div>
            
            <div id="result-message" class="result-message">
                <!-- Sonuç mesajı buraya gelecek -->
            </div>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <span>Malzemeler sepete ekleniyor...</span>
            </div>
            
            <div id="pending-section" class="pending-ingredients" style="display: none;">
                <div class="pending-title">Bekleyen Malzemeler:</div>
                <div id="ingredient-list" class="ingredient-list">
                    <!-- Malzeme listesi buraya gelecek -->
                </div>
            </div>
            
            <div id="no-ingredients" class="no-ingredients">
                Henüz eklenecek malzeme bulunmuyor.<br>
                Web uygulamasından malzeme seçin.
            </div>
            
            <div class="buttons">
                <button id="addToCartBtn" class="btn primary" disabled>
                    Sepete Ekle
                </button>
                <button id="openYemekSepetiBtn" class="btn secondary">
                    YemekSepeti Market'i Aç
                </button>
                <button id="clearBtn" class="btn secondary">
                    Malzeme Listesini Temizle
                </button>
            </div>
        </div>
        
        <div class="footer">
            Smart Grocery Extension v1.0.0<br>
            YemekSepeti ile entegre çalışır
        </div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
